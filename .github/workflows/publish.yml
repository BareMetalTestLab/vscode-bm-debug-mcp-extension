name: Publish

# Publishing is triggered by pushing a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Marketplace auth uses Trusted Publishing: the GitHub Actions OIDC flow
# registered on the publisher page (marketplace.visualstudio.com →
# publisher → Trusted Publishing: this repo + this file). No PAT needed —
# the job requires `permissions: id-token: write` and the `--oidc` flag:
# without the flag vsce silently falls back to PAT auth and fails.
# `npm ci` from the docs recipe is skipped on purpose: the extension has
# no dependencies and no package-lock.json.
#
# Open VSX has no OIDC support and needs the OVSX_PAT repo secret. NOTE:
# the `secrets` context is not allowed in job-level `if`, so the check
# lives in step-level conditions via env.
on:
  push:
    tags: ['v*']

jobs:
  marketplace:
    name: VS Code Marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish (Trusted Publishing OIDC)
        run: npx --yes @vscode/vsce@latest publish --no-dependencies --oidc

  open-vsx:
    name: Open VSX
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        if: env.OVSX_PAT != ''

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          pat: ${{ secrets.OVSX_PAT }}
          registryUrl: https://open-vsx.org
          noDependencies: true

      - name: Skipped (no OVSX_PAT)
        if: env.OVSX_PAT == ''
        run: echo 'OVSX_PAT is not configured — Open VSX publish skipped'
